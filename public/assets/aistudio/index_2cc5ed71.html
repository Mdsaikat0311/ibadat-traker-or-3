        /* কাস্টম স্টাইল */
        :root {
        --primary-color: #0d9488;
        --inactive-color: #6b7280;
    }
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f7f9fa; 
    }
    .main-container {
        max-width: 420px;
        margin: 0 auto;
        background-color: #f7f9fa; 
        min-height: 100vh;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
    }
        
        .nav-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--inactive-color);
            transition: color 0.15s;
        }
        
        .nav-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px; 
            height: 44px; 
            border-radius: 50%;
            margin-bottom: 2px;
            transition: background-color 0.15s;
        }
        
        .nav-item-label {
            color: var(--inactive-color);
            font-size: 0.75rem;
            padding-top: 2px;
            transition: color 0.15s;
            line-height: 1;
        }
        
        .nav-active .nav-pill {
            background-color: var(--primary-color);
        }
        
        .nav-active .nav-icon {
            color: white;
        }

        .nav-active .nav-item-label {
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .nav-item:hover .nav-icon, 
        .nav-item:hover .nav-item-label {
            color: var(--primary-color); 
        }
        .nav-active.nav-item:hover .nav-icon {
            color: white;
        }

        .prayer-toggle input:checked + .slider {
            background-color: var(--primary-color);
        }
        .prayer-toggle input:checked + .slider:before {
            transform: translateX(20px);
        }
        .slider {
            transition: all 0.3s;
        }
        .nawafil-toggle input:checked + .slider {
            background-color: #4f46e5; /* Indigo-600 */
        }
        .nawafil-toggle input:checked + .slider:before {
            transform: translateX(20px);
        }

        .stat-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .amal-toggle input:checked + .slider {
            background-color: #10b981; /* Emerald-500 */
        }
        .amal-toggle input:checked + .slider:before {
            transform: translateX(20px);
        }
        
        /* --- রিপোর্ট ভিউ কাস্টম স্টাইল --- */
        .date-cell {
            position: relative;
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            border: 1px solid #f1f5f9;
        }
        .date-cell.current-date {
            border: 2px solid #ef4444;
        }
        .date-cell.future-date {
            background-color: #f1f5f9;
            color: #cbd5e1;
            cursor: not-allowed !important;
            pointer-events: none;
        }
        .date-number {
            font-weight: 500;
            color: #1e293b;
        }
        .future-date .date-number {
            color: #94a3b8;
        }
        .date-points {
            font-size: 0.625rem;
            color: #0d9488;
            font-weight: 600;
        }
        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            padding-bottom: 8px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            border-top: 1px solid #f1f5f9;
        }
        /* বার চার্ট স্টাইল */
        .bar-chart-container {
            position: relative;
            height: 150px;
            width: 100%;
            display: flex;
            align-items: flex-end;
            padding: 0 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .chart-y-axis {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        .chart-y-axis div {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #e2e8f0;
        }
        .bar {
            width: 14%; 
            margin: 0 1%;
            background-color: #0d9488;
            transition: height 0.3s ease;
            position: relative;
        }
        .bar-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.625rem;
            color: #475569;
            font-weight: 500;
        }
        .graph-label {
             position: absolute;
             left: -10px;
             font-size: 0.625rem;
             color: #64748b;
             transform: translateY(50%);
        }
        .completion-stats {
            display: flex;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .completion-stats span {
            font-size: 0.65rem; /* 10px */
            line-height: 1;
            margin-right: 8px;
            font-weight: 500;
        }
    </style>
</head>

        function calculatePoints(dateString = todayKey) {
            let points = 0;
            const salahLog = appState.salahLog[dateString] || {};
            const nawafilLog = appState.nawafilLog[dateString] || {};
            const dhikrLog = appState.dhikrLog[dateString] || {};
            const morningLog = appState.morningLog[dateString] || {};
            const nightlyLog = appState.nightlyLog[dateString] || {};
            const quranLog = appState.quranLog[dateString] || {};
            const specialAmalLog = appState.specialAmalLog[dateString] || {};
            
            // --- আগের কোড রিমুভ করা হয়েছে (যেখানে ডেট চেক করে ০ রিটার্ন করত) ---
            // এই পরিবর্তনটি পেছনের তারিখের পয়েন্ট গণনা করতে সাহায্য করবে
            
            PRAYERS.forEach(p => {
                if (salahLog[p.key]) {
                    if (p.key === 'tahajjud') {
                        points += POINTS.tahajjud;
                    } else if (p.type === 'fard') {
                        points += POINTS.fard; 
                    }
                }
                if (p.type === 'fard' && salahLog[p.key + '_dua']) {
                    points += POINTS.dua_zikir;
                }
            });

            // নতুন টাস্ক পয়েন্ট
            if (salahLog['fajr_morning_zikir']) points += POINTS.morning_evening_zikir;
            if (salahLog['maghrib_evening_zikir']) points += POINTS.morning_evening_zikir;

            NAWAFIL_PRAYERS.forEach(p => {
                if (nawafilLog[p.key]) {
                    points += POINTS.nafil; 
                }
            });
            
            DHIKR_CHECKLIST_TASKS.forEach(d => {
                if (dhikrLog[d.key]) {
                    points += POINTS.dhikr_checklist;
                }
            });
            
            MORNING_TASKS.forEach(t => {
                if (morningLog[t.key]) {
                    points += t.point; 
                }
            });
            
            NIGHTLY_TASKS.forEach(t => {
                if (nightlyLog[t.key]) {
                    points += t.point; 
                }
            });

            QURAN_TASKS.forEach(t => {
                if (quranLog[t.key]) {
                    points += t.point; 
                }
            });
            // calculatePoints এর ভেতরে QURAN_TASKS লুপের নিচে:
SPECIAL_AMAL_TASKS.forEach(t => {
    if (specialAmalLog[t.key]) {
        points += t.point; 
    }
});
            if (dateString === todayKey) {
                appState.stats.todayPoints = points;
                appState.stats.high7Day = Math.max(appState.stats.high7Day, points);
                appState.stats.high30Day = Math.max(appState.stats.high30Day, points);
            }

            return points; 
        }
        
        function dateDiffInDays(date1, date2) {
            const ONE_DAY = 1000 * 60 * 60 * 24;
            const time1 = date1.getTime();
            const time2 = date2.getTime();
            const diff = Math.round(Math.abs(time2 - time1) / ONE_DAY); 
            return diff + 1; 
        }

        function getLifetimeDays() {
            const startDate = new Date(appState.lifetimeStartDate);
            const today = new Date(todayKey);
            startDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            
            if (startDate > today) return 0;

            return dateDiffInDays(startDate, today);
        }
        
        function formatStatsSpan(count, total, label) {
            if (total === 0) {
                return `<span class="text-gray-500" title="${label} পরিসংখ্যান">N/A</span>`; 
            }
            if (total < count) total = count; 
            const percentage = (count / total) * 100;
            const colorClass = percentage < 50 ? 'text-red-500' : 'text-green-600';
            return `
                <span class="${colorClass} font-semibold" title="${label} সম্পন্ন: ${count} / ${total}">
                    ${label}(${count}/${total})
                </span>
            `;
        }

        function getTaskCompletionStats(taskKey, logType) {
            const today = new Date(todayKey);
            const startDate = new Date(appState.lifetimeStartDate);
            startDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            
            let weekCount = 0; 
            let monthCount = 0; 
            let lifetimeCount = 0; 
            const actualLifetimeDays = getLifetimeDays();

            for (let i = 0; i < actualLifetimeDays; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateKey = date.toDateString();

                if (date < startDate) break;

                const log = appState[logType] ? appState[logType][dateKey] : undefined;
                
                if (log && log[taskKey]) {
                    if (i < 7) {
                        weekCount++;
                    }
                    if (i < 30) {
                        monthCount++;
                    }
                    lifetimeCount++;
                }
            }
            
            return {
                week: weekCount,
                month: monthCount,
                lifetime: lifetimeCount,
                totalWeekDays: 7,
                totalMonthDays: 30,
                totalLifetimeDays: actualLifetimeDays 
            };
        }
        
        // পরিসংখ্যান এবং পয়েন্ট ক্যালকুলেশন ফাংশন
        function getSalahStats() {
            const today = new Date(todayKey);
            
            const stats = {
                todayPoints: 0,
                yesterdayPoints: 0,
                totalPoints7Days: 0,
                totalPoints30Days: 0,
                highScore30Days: 0,
                fardCompleted7Days: 0,
                maxFard: PRAYERS.filter(p => p.type === 'fard').length,
                totalLifetimePoints: 0 
            };
            
            // লুপ চালিয়ে গত ৩০ দিনের ডাটা বের করা (আজকে সহ)
            for (let i = 0; i < 30; i++) {
                const date = new Date(today); 
                date.setDate(date.getDate() - i);
                const dateKey = date.toDateString();
                
                // ওই তারিখের পয়েন্ট হিসাব করা
                const points = calculatePoints(dateKey); 
                
                // ১. আজকের পয়েন্ট (i=0)
                if (i === 0) {
                    stats.todayPoints = points;
                }

                // ২. গতকালের পয়েন্ট (i=1)
                if (i === 1) {
                    stats.yesterdayPoints = points;
                }

                // ৩. সাপ্তাহিক সেরা (গত ৭ দিন: i=0 থেকে i=6)
                if (i < 7) {
                    stats.totalPoints7Days += points;
                    
                    // ৭ দিনের ফরয সালাত গণনা
                    const salahLog = appState.salahLog[dateKey] || {};
                    const fardCompleted = PRAYERS.filter(p => p.type === 'fard' && salahLog[p.key]).length;
                    stats.fardCompleted7Days += fardCompleted;
                }
                
                // ৪. মাসিক সেরা (৩০ দিন)
                stats.totalPoints30Days += points;
                
                // ৩০ দিনের হাই স্কোর
                stats.highScore30Days = Math.max(stats.highScore30Days, points);
            }

    const activeDateKey = appState.currentViewingDateKey;

    const currentStats = getSalahStats();
    
    // অ্যাপ স্টেটে স্ট্যাটস আপডেট করা
    appState.stats = { ...appState.stats, ...currentStats };
    appState.stats.totalPoints = currentStats.totalLifetimePoints;

    // ৪. লোকাল স্টোরেজে সেভ
    localStorage.setItem('ibadat_tracker_state_v3', JSON.stringify(appState));

    // ৫. ফায়ারবেস আপডেট (Realtime)
    if (auth.currentUser) {

        // তারিখ কনভার্ট করা
        const dateObj = new Date(activeDateKey);
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        const formattedDate = `${year}-${month}-${day}`;

        // আপডেটের অবজেক্ট তৈরি
        const updates = {};
        
        // ক. তারিখের পয়েন্ট
        updates[`users/${uid}/pointsHistory/${formattedDate}`] = points;
        
        // খ. নাম
        updates[`users/${uid}/name`] = appState.currentUser.name;
        
        // গ. পুরো স্টেট
        updates[`users/${uid}/fullState`] = JSON.stringify(appState);

        updates[`users/${uid}/stats`] = appState.stats;

        update(ref(db), updates).then(() => {

        }).catch((err) => {

        function getLiveReportDataForLast7Days(today) {
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const salahPerformance = {};
            const dailyPoints = {};

            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - 6); 

            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(startOfWeek.getDate() + i);
                const dateKey = date.toDateString();
                const dayLabel = dayNames[date.getDay()];
                
                const points = calculatePoints(dateKey);
                dailyPoints[date.getDate()] = points;
                
                const salahLog = appState.salahLog[dateKey] || {};
                const fardCompleted = PRAYERS.filter(p => p.type === 'fard' && salahLog[p.key]).length;
                
                salahPerformance[dayLabel] = fardCompleted;
            }
            
            const monthPoints = {};
            const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
            const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            
            for(let d = new Date(monthStart); d <= monthEnd; d.setDate(d.getDate() + 1)) {
                const dateKey = d.toDateString();
                const dateNum = d.getDate();
                if (!dailyPoints[dateNum]) {
                     monthPoints[dateNum] = calculatePoints(dateKey);
                } else {
                     monthPoints[dateNum] = dailyPoints[dateNum];
                }
            }
            return { monthPoints, salahPerformance };
        }

            if (!("Notification" in window)) return;
            if (Notification.permission === "granted") return;
            if (Notification.permission !== "denied") {

                    if (permission === "granted") {

                    }
                });
            }
        }

window.deleteReminder = function() {
    const activityKey = document.getElementById('reminder-activity-key').value;
    const activityName = document.getElementById('activity-name').innerText;

    // ১. অ্যাপ স্টেট থেকে রিমাইন্ডারটি মুছে ফেলা
    if (appState.reminders[activityKey]) {
        delete appState.reminders[activityKey];
    }

    // ২. কর্ডোভা নোটিফিকেশন সিস্টেম থেকে বাতিল করা
    if (window.cordova && cordova.plugins && cordova.plugins.notification) {
        // হ্যাশ কোড জেনারেট করে আইডি বের করা
        const baseId = Math.abs(activityKey.hashCode());
        
        // ওই আইডির সাথে সম্পর্কিত সব রিমাইন্ডার লুপ চালিয়ে ডিলিট করা
        let idsToCancel = [];
        // যেহেতু আপনি লুপে ১০-১৫ টা সেট করেন, তাই সেফটির জন্য ২০টি চেক করা হচ্ছে
        for(let c=0; c<20; c++) idsToCancel.push(baseId + c);
        
        cordova.plugins.notification.local.cancel(idsToCancel, function() {
            console.log("Reminder cancelled for " + activityKey);
        });
    }

    // ৩. ডাটা সেভ এবং স্ক্রিন আপডেট
    saveData();
    closeReminderModal();
    updateHeader();
    renderApp(); // যাতে আইকনটি আবার ধূসর হয়ে যায়
    
    // কনফার্মেশন মেসেজ
    showCustomAlert(`${activityName}-এর রিমাইন্ডার বন্ধ করা হয়েছে।`, 'success');
}

// পারমিশন চেক করার হেল্পার ফাংশন
async function checkNotificationPermissions() {
    if (!window.cordova) return true; // পিসিতে টেস্ট করার জন্য
    return new Promise((resolve) => {
        cordova.plugins.notification.local.hasPermission(function(granted) {
            if (granted) {
                resolve(true);
            } else {
                cordova.plugins.notification.local.requestPermission(function(granted) {
                    if (granted) resolve(true);
                    else {
                        showCustomAlert('নোটিফিকেশন পারমিশন ছাড়া রিমাইন্ডার কাজ করবে না।', 'alert');
                        resolve(false);
                    }
                });
            }
        });
    });
}

    "পাক-পবিত্রতা ঈমানের অর্ধেক। (মুসলিম)",
    "উম্মুল মু’মিনীন ‘আয়িশা (রাঃ) থেকে বর্ণিতঃ তিনি বলেন, আল্লাহর রসূল (সাল্লাল্লাহু ‘আলাইহি ওয়া সাল্লাম)- এর নিকট সর্বপ্রথম যে ওয়াহী আসে, তা ছিল নিদ্রাবস্থায় বাস্তব স্বপ্নরূপে। যে স্বপ্নই তিনি দেখতেন তা একেবারে প্রভাতের আলোর ন্যায় প্রকাশিত হতো। অতঃপর তাঁর নিকট নির্জনতা পছন্দনীয় হয়ে দাঁড়ায় এবং তিনি ‘হেরা’র গুহায় নির্জনে অবস্থান করতেন। আপন পরিবারের নিকট ফিরে এসে কিছু খাদ্যসামগ্রী সঙ্গে নিয়ে যাওয়ার পূর্বে- এভাবে সেখানে তিনি এক নাগাড়ে বেশ কয়েক দিন ‘ইবাদাতে মগ্ন থাকতেন। অতঃপর  খাদীজা (রাঃ)-এর নিকট  ফিরে এসে আবার একই সময়ের জন্য কিছু খাদ্যদ্রব্য নিয়ে যেতেন। এভাবে ‘হেরা’ গুহায় অবস্থানকালে তাঁর নিকট ওয়াহী আসলো।  তাঁর নিকট ফেরেশতা এসে বললো, ‘পাঠ করুন’। আল্লাহর রসূল (সাল্লাল্লাহু ‘আলাইহি ওয়া সাল্লাম) বলেনঃ [“আমি বললাম, ‘আমি পড়তে জানি না।] তিনি (সাল্লাল্লাহু ‘আলাইহি ওয়া সাল্লাম) বলেনঃ অতঃপর সে আমাকে জড়িয়ে ধরে এমন ভাবে চাপ দিলো যে, আমার খুব কষ্ট হলো। অতঃপর সে আমাকে ছেড়ে দিয়ে বললো, ‘পাঠ করুন’। আমি বললামঃ আমি তো পড়তে জানি না’। সে দ্বিতীয় বার আমাকে জড়িয়ে ধরে এমনভাবে চাপ দিলো যে, আমার খুব কষ্ট হলো। অতঃপর সে আমাকে ছেড়ে দিয়ে  বললো, ‘পাঠ করুন’। আমি উত্তর দিলাম, ‘আমি তো পড়তে জানি না’। আল্লাহর রসূল (সাল্লাল্লাহু ‘আলাইহি ওয়া সাল্লাম) বলেন, অতঃপর তৃতীয়বারে তিনি আমাকে জড়িয়ে ধরে চাপ দিলেন। তারপর ছেড়ে দিয়ে বললেন, “পাঠ করুন আপনার রবের নামে, যিনি সৃষ্টি করেছেন। যিনি সৃষ্টি করেছেন মানুষকে জমাট রক্ত পিন্ড থেকে, পাঠ করুন, আর আপনার রব অতিশয় দয়ালু”- (সূরা আলাক্ব ৯৬/১-৩)। অতঃপর এ আয়াত নিয়ে আল্লাহর রসূল (সাল্লাল্লাহু ‘আলাইহি ওয়া সাল্লাম)- প্রত্যাবর্তন করলেন। তাঁর হৃদয় তখন কাঁপছিল। তিনি খাদীজা বিন্‌তু খুওয়ায়লিদের নিকট এসে বললেন, ‘আমাকে চাদর দ্বারা আবৃত কর’, ‘আমাকে চাদর দ্বারা আবৃত কর’। তাঁরা তাঁকে চাদর দ্বারা আবৃত করলেন। এমনকি তাঁর শংকা দূর হলো। তখন তিনি খাদীজা (রাঃ) এর নিকট ঘটনাবৃত্তান্ত জানিয়ে তাঁকে বললেন, আমি আমার নিজেকে নিয়ে শংকা বোধ করছি। খাদীজা (রাঃ) বললেন, আল্লাহর কসম, কখনই নয়। আল্লাহ আপনাকে কখনো লাঞ্ছিত করবেন না।  আপনি তো আত্মীয়–স্বজনের সঙ্গে সদাচরণ করেন, অসহায় দুস্থদের দায়িত্ব বহন করেন, নিঃস্বকে সহযোগিতা করেন, মেহমানের আপ্যায়ন করেন এবং হক পথের দুর্দশাগ্রস্থকে সাহায্য করেন। অতঃপর তাঁকে নিয়ে খাদীজা (রাঃ) তাঁর চাচাত ভাই ওয়ারাকাহ ইব্‌নু নাওফাল ইব্‌নু ‘আবদুল আসাদ ইব্‌নু ‘আবদুল ‘উযযাহ’র নিকট গেলেন, যিনি অন্ধকার যুগে ‘ঈসায়ী ধর্ম গ্রহন করেছিলেন। যিনি ইবরানী ভাষায় লিখতে পারতেন এবং আল্লাহর তাওফীক অনুযায়ী ইবরানী ভাষায় ইনজীল হতে ভাষান্তর করতেন। তিনি ছিলেন অতি বৃদ্ধ এবং অন্ধ হয়ে গিয়েছিলেন। খাদীজা (রাঃ) তাঁকে বললেন, ‘হে চাচাত ভাই! আপনার ভাতিজার কথা শুনুন’। ওয়ারাকাহ তাঁকে জিজ্ঞেস করলেন, ‘ভাতিজা! তুমি কী দেখ?’ আল্লাহর রসূল (সাল্লাল্লাহু ‘আলাইহি ওয়া সাল্লাম) যা দেখেছিলেন, সবই বর্ণনা করলেন। তখন ওয়ারাকাহ তাঁকে বললেন, এটা সেই বার্তাবাহক যাকে আল্লাহ মূসা (‘আঃ)- এর নিকট পাঠিয়েছিলেন। আফসোস! আমি যদি সেদিন যুবক থাকতাম। আফসোস ! আমি যদি সেদিন জীবিত থাকতাম, যেদিন তোমার কওম তোমাকে বহিষ্কার করবে’। আল্লাহর রসূল (সাল্লাল্লাহু ‘আলাইহি ওয়া সাল্লাম) বললেন, [‘তারা কি আমাকে বের করে দেবে?’] তিনি বললেন, ‘হ্যাঁ, তুমি যা নিয়ে এসেছো অনুরূপ (ওয়াহী) কিছু যিনিই নিয়ে এসেছেন তাঁর সঙ্গেই বৈরিতাপূর্ণ আচরণ করা হয়েছে। সেদিন যদি আমি থাকি, তবে তোমাকে জোরালোভাবে সাহায্য করব। এর কিছুদিন পর ওয়ারাকাহ (‘আঃ) ইন্তিকাল করেন। আর ওয়াহীর বিরতি ঘটে।(৩৩৯২, ৪৯৫৩, ৪৯৫৫, ৪৯৫৬, ৪৯৫৭, ৬৯৮২; মুসলিম ১/৭৩ হাঃ ১৬০, আহমাদ ২৬০১৮) (আধুনিক প্রকাশনীঃ ৩, ইসলামী ফাউন্ডেশনঃ ৩)সহিহ বুখারী, হাদিস নং ৩ হাদিসের মান: সহিহ হাদিস ",

// --- ২. অনলাইন থেকে ডাটা আনার ফাংশন (আপডেট করা হয়েছে) ---
async function fetchOnlineQuotes() {
    try {
        // র‍্যান্ডমলি ঠিক করব আমরা আয়াত দেখাবো নাকি হাদিস (৫০/৫০ চান্স)
        // যেহেতু ভালো বাংলা হাদিস API পাওয়া কঠিন, তাই আমরা এখানে মূলত 
        // কুরআনের আয়াত API ব্যবহার করছি যা খুব নির্ভরযোগ্য।
        
        // ১ থেকে ৬২৩৬ এর মধ্যে যেকোনো একটি আয়াত নম্বর
        const randomAyahId = Math.floor(Math.random() * 6236) + 1;
        
        // বাংলা অনুবাদসহ আয়াত ফেচ করা (Al-Quran Cloud API)
        const response = await fetch(`https://api.alquran.cloud/v1/ayah/${randomAyahId}/bn.bengali`);
        const data = await response.json();

        if (data.code === 200) {
            const ayah = data.data;
            
            // সুন্দরভাবে ফরম্যাট করা: আয়াত + (সূরা নাম, আয়াত নম্বর)
            const formattedQuote = `${ayah.text}\n\n— (সূরা ${ayah.surah.name}, আয়াত: ${ayah.numberInSurah})`;
            
            return [formattedQuote]; 
        }
        
        return []; // কোনো কারণে ফেইল করলে ব্যাকআপ লিস্ট থেকে দেখাবে
    } catch (error) {
        console.log("Online fetch failed, switching to backup data.");
        return [];
    }
}

// --- ৩. অটোমেটিক হাদিস টাইমার (হাইব্রিড - ফিক্সড) ---

async function startHadithTimer() {
    // আগের সেট করা সব শিডিউল বাতিল করা
    stopHadithTimer();

    if (!window.cordova) {
        console.log("Browser Mode: Hadith Timer Started (Simulation)");
        return;
    }

    // ১. শুরুতে ব্যাকআপ হাদিসগুলো নিলাম
    let finalQuoteList = [...BACKUP_QUOTES]; 

    // ২. ইন্টারনেট থাকলে অনলাইন থেকে ১টি আয়াত এনে লিস্টের সাথে মিশিয়ে দেব
    try {
        const onlineQuotes = await fetchOnlineQuotes();
        if (onlineQuotes && onlineQuotes.length > 0) {
            finalQuoteList = [...onlineQuotes, ...finalQuoteList];
        }
    } catch (e) {
        console.log("Offline mode: Using backup quotes only.");
    }

    const intervalMinutes = 30; // ৩০ মিনিট পর পর
    // --- পরিবর্তন: সংখ্যা বাড়ানো হয়েছে (৫০ থেকে ২০০) ---
    const scheduleCount = 200;   // আগামী ২০০ বারের জন্য (প্রায় ৪ দিন একটানা চলবে)
    let notifications = [];
    const now = new Date();

    for (let i = 1; i <= scheduleCount; i++) {
        const triggerTime = new Date(now.getTime() + (i * intervalMinutes * 60000));
        
        // র‍্যান্ডম একটি লাইন বেছে নেবে
        const randomQuote = finalQuoteList[Math.floor(Math.random() * finalQuoteList.length)];

function startGeneralReminderTimer() {
    stopGeneralReminderTimer(); // আগেরগুলো ক্লিয়ার করা

    if (!window.cordova) {
        console.log(`Browser Mode: General Timer Started`);
        return;
    }

    const intervalMinutes = parseInt(appState.generalReminder.interval);
    
    if(!intervalMinutes || isNaN(intervalMinutes)) {
        showCustomAlert('দয়া করে সময়ের ব্যবধান ঠিক করুন।', 'alert');
        return;
    }

    // --- পরিবর্তন: সংখ্যা বাড়ানো হয়েছে (৫০ থেকে ৫০০) ---
    const scheduleCount = 500; // আগামী ৫০০ বারের জন্য সেট হবে (অনেক দীর্ঘ সময় চলবে)
    let notifications = [];
    const now = new Date();

    for (let i = 1; i <= scheduleCount; i++) {
        const triggerTime = new Date(now.getTime() + (i * intervalMinutes * 60000));

        notifications.push({
            id: 90000 + i, // ইউনিক আইডি (90001...)
            title: '⚠️ জিকির রিমাইন্ডার',
            text: `সময় বয়ে যাচ্ছে! জিকির ও ইস্তিগফারে ব্যস্ত হোন। কারণ গুনাহ মাফ ও রহমত পাওয়ার সবচেয়ে সহজ দরজাগুলোর একটি হলো জিকির।`,
            trigger: { at: triggerTime },
            foreground: true,
            priority: 2,
            wakeup: true,
            channel: 'general-channel',
            sound: 'res://raw/reminder_sound2'
        });
    }

    cordova.plugins.notification.local.schedule(notifications);
}

function stopGeneralReminderTimer() {
    if (window.cordova && cordova.plugins && cordova.plugins.notification) {
        let ids = [];
        // আগে 100 ছিল, এখন 510 করা হলো কারণ আপনি 500টি সেট করেছেন
        for (let i = 1; i <= 510; i++) ids.push(90000 + i);

}

window.saveReminderSettings = function() {
    const activityKey = document.getElementById('reminder-activity-key').value;
    const activityName = document.getElementById('activity-name').innerText;
    const startTime = document.getElementById('reminder-start-time').value;
    const count = document.getElementById('reminder-count').value;
    const interval = document.getElementById('reminder-interval').value;
    
    if (!startTime || !count || !interval) return showCustomAlert('সব তথ্য পূরণ করুন!', 'alert');

    // ১. আগে স্টেট আপডেট করুন (যাতে ব্রাউজার এবং মোবাইল দুই জায়গাতেই ডেটা থাকে)
    const totalCount = parseInt(count, 10);
    const minuteInterval = parseInt(interval, 10);

    appState.reminders[activityKey] = {
        start: startTime,
        count: totalCount,
        interval: minuteInterval,
        name: activityName
    };

    // ২. যদি মোবাইল অ্যাপ হয় (Cordova), তাহলে লোকাল নোটিফিকেশন শিডিউল করুন
    if (window.cordova && cordova.plugins && cordova.plugins.notification) {
        
        const [startHour, startMinute] = startTime.split(':').map(Number);
        
        // ফিক্স ১: Math.abs ব্যবহার করা যাতে ID সবসময় পজিটিভ হয়
        const baseId = Math.abs(activityKey.hashCode()); 

        cordova.plugins.notification.local.cancel(baseId, function() {
            let idsToCancel = [];
            for(let c=0; c<20; c++) idsToCancel.push(baseId + c);
            
            cordova.plugins.notification.local.cancel(idsToCancel, function() {
                
                let scheduledNotifications = [];
                let now = new Date();
                
                for (let i = 0; i < totalCount; i++) {
                    
                    // বর্তমান সময়ের সাথে মিনিট যোগ করে টার্গেট টাইম বের করা
                    let targetTime = new Date();
                    targetTime.setHours(startHour);
                    targetTime.setMinutes(startMinute + (i * minuteInterval));
                    targetTime.setSeconds(0);

                    // যদি নির্দিষ্ট সময়টি আজকের জন্য পার হয়ে গিয়ে থাকে, তবে পরের দিনের জন্য শিডিউল হবে
                    if (targetTime <= now) {
                        targetTime.setDate(targetTime.getDate() + 1);
                    }

                    scheduledNotifications.push({
                        id: baseId + i,
                        title: 'ইবাদত রিমাইন্ডার!',
                        text: `${activityName} এর সময় হয়েছে। (${i + 1}/${totalCount})`,
                        trigger: { at: targetTime }, // সঠিক ও নিখুঁত সময় ট্রিগার
                        foreground: true,
                        priority: 2,
                        wakeup: true,
                        lockscreen: true,
                        channel: 'ibadat-channel-custom', 
                        sound: (window.device && window.device.platform === 'Android') ? 'res://raw/reminder_sound2' : null 
                    });
                }

                if (scheduledNotifications.length > 0) {
                     cordova.plugins.notification.local.schedule(scheduledNotifications);
                }
            });
        });
    } 
    // ৩. যদি পিসি বা ব্রাউজার হয়
    else {
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }
    }

    // ৪. সবশেষে ডেটা সেভ করুন এবং মডাল বন্ধ করুন
    saveData();
    closeReminderModal();
    updateHeader();
    renderApp();
    
    // কনফার্মেশন মেসেজ
    showCustomAlert(`${activityName}-এর রিমাইন্ডার সেট হয়েছে!`, 'success');
}

            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const firstDayOfMonth = new Date(viewYear, viewMonth, 1).getDay(); 
            const todayISO = today.toISOString().split('T')[0];

            const monthNamesBn = [
                'জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
                'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'
            ];
            const currentMonthName = monthNamesBn[viewMonth];
            const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thr', 'Fri', 'Sat'];

            let maxPointsInMonth = 0;
            for (let d = 1; d <= daysInMonth; d++) {
                const dDate = new Date(viewYear, viewMonth, d);
                const p = calculatePoints(dDate.toDateString());
                if (p > maxPointsInMonth) maxPointsInMonth = p;
            }

            const viewingDateObj = new Date(appState.currentViewingDateKey);
            const vYear = viewingDateObj.getFullYear();
            const vMonth = String(viewingDateObj.getMonth() + 1).padStart(2, '0');
            const vDay = String(viewingDateObj.getDate()).padStart(2, '0');
            const viewingDateISO = `${vYear}-${vMonth}-${vDay}`;

            const datePickerHTML = `
                <div class="mb-4 bg-white p-4 rounded-xl shadow-md border border-gray-100">
                    <h3 class="text-base font-semibold text-gray-800 mb-3 flex items-center">
                        <i data-lucide="calendar" class="w-5 h-5 inline mr-2 text-teal-600"></i> ডেটা আপডেটের তারিখ নির্বাচন: 
                    </h3>
                    <div class="flex items-center justify-between space-x-2">
                        <button onclick="moveDate(-1)" class="p-2 border border-gray-300 rounded-lg text-teal-600 hover:bg-gray-100 transition">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <input type="date" id="date-selector" value="${viewingDateISO}" max="${todayISO}" onchange="selectDateAndView(this.value)" class="flex-grow py-2 px-3 border border-teal-300 rounded-lg text-base text-gray-700 font-medium focus:ring-teal-500 focus:border-teal-500 text-center">
                        <button onclick="moveDate(1)" class="p-2 border border-gray-300 rounded-lg text-teal-600 transition ${appState.currentViewingDateKey === todayKey ? 'opacity-30 cursor-not-allowed pointer-events-none bg-gray-100' : 'hover:bg-gray-100'}" ${appState.currentViewingDateKey === todayKey ? 'disabled' : ''}>
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <p class="text-xs text-red-500 mb-4 text-center">তারিখ পরিবর্তন করে 'সালাত', 'আমল' বা 'যিকির' ট্যাবে যান।</p>
            `;

            let calendarCells = '';
            
            for (let i = 0; i < firstDayOfMonth; i++) {
                calendarCells += '<div class="date-cell bg-gray-50 border-transparent"></div>';
            }

            for (let date = 1; date <= daysInMonth; date++) {
                const cellDate = new Date(viewYear, viewMonth, date);
                const cellDateKey = cellDate.toDateString();
                const isToday = cellDateKey === todayKey;
                const isSelected = cellDateKey === appState.currentViewingDateKey;
                const isFutureDate = cellDate > today;
                const points = calculatePoints(cellDateKey);
                const pointDisplay = points > 0 ? `<div class="date-points" style="color: inherit; font-weight: 700;">+${points}</div>` : '';
                
                let cellClasses = ['date-cell', 'p-1', 'cursor-pointer', 'transition', 'rounded-lg', 'm-0.5'];
                let inlineStyle = '';

                if (isFutureDate) {
                    cellClasses.push('future-date', 'opacity-50');
                    inlineStyle = `background-color: #f1f5f9; color: #cbd5e1;`;
                } else {
                    if (points > 0) {
                        const percentage = maxPointsInMonth > 0 ? (points / maxPointsInMonth) : 0;
                        let hue, saturation, lightness, textColor;
                        if (percentage < 0.5) {
                            hue = 0; 
                            saturation = 80; 
                            const redPos = percentage / 0.5; 
                            lightness = 60 + (redPos * 35); 
                            textColor = lightness < 70 ? '#ffffff' : '#7f1d1d';
                        } else {
                            hue = 145; 
                            saturation = 75;
                            const greenPos = (percentage - 0.5) / 0.5;
                            lightness = 95 - (greenPos * 55); 
                            textColor = lightness < 60 ? '#ffffff' : '#14532d';
                        }
                        inlineStyle = `
                            background-color: hsl(${hue}, ${saturation}%, ${lightness}%); 
                            border: 1px solid hsl(${hue}, ${saturation}%, ${lightness - 10}%); 
                            color: ${textColor};
                        `;
                    } else {
                         inlineStyle = `background-color: #ffffff; border: 1px solid #e2e8f0; color: #64748b;`;
                    }
                }
                if (isToday) cellClasses.push('ring-2 ring-offset-1 ring-red-400');
                if (isSelected) {
                     cellClasses.push('ring-2 ring-teal-600 z-10 shadow-lg transform scale-105'); 
                }

                calendarCells += `
                    <div class="${cellClasses.join(' ')}" style="${inlineStyle}" onclick="selectDateAndView('${cellDateKey}')">
                        <div class="date-number font-semibold" style="color: inherit;">${date}</div>
                        ${pointDisplay}
                    </div>
                `;
            }
            
            const calendarHTML = `
                <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100">

                        </button>
                    </div>
                    <div class="calendar-header">
                        ${dayLabels.map(d => `<span>${d}</span>`).join('')}
                    </div>
                    <div class="calendar-grid">
                        ${calendarCells}
                    </div>
                </div>
            `;
            
            const realToday = new Date(todayKey);
            const totalFardPrayers = 5;
            const maxGraphValue = 6;
            let totalCompletedIn7Days = 0;

            const graphBarsHTML = dayLabels.map((day, index) => {
                const date = new Date(realToday);
                date.setDate(realToday.getDate() - (6 - index));
                const dateStringKey = date.toDateString();
                const salahLog = appState.salahLog[dateStringKey] || {};
                const completed = PRAYERS.filter(p => p.type === 'fard' && salahLog[p.key]).length;
                totalCompletedIn7Days += completed;
                
                const heightPercentage = (completed / maxGraphValue) * 100;
                const isTodayCell = dateStringKey === todayKey;
                const barColor = isTodayCell ? 'bg-red-500' : 'bg-teal-600';

                return `
                    <div class="bar ${barColor}" style="height: ${heightPercentage}%;" title="${day}: ${completed}টি ফরয">
                        <div class="bar-label">${day.slice(0, 3)}</div>
                    </div>
                `;
            }).join('');

            const completionPercentage = ((totalCompletedIn7Days / (totalFardPrayers * 7)) * 100).toFixed(1);
            
            const graphLinesHTML = [0, 1, 2, 3, 4, 5, 6].map(val => {
                const height = (val / maxGraphValue) * 100;
                const lineStyle = val === totalFardPrayers ? 'border-dashed border-red-400' : 'border-dashed border-gray-200';
                return `<div class="${lineStyle}" style="bottom: ${height}%;"></div>`;
            }).join('');
            
            const graphLabelsHTML = [0, totalFardPrayers, maxGraphValue].map(val => {
                const height = (val / maxGraphValue) * 100;
                return `<div class="graph-label" style="bottom: ${height}%;">${val}</div>`;
            }).join('');

            const graphHTML = `
                <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100 mt-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i data-lucide="bar-chart-2" class="w-5 h-5 mr-2 text-teal-600"></i> গত ৭ দিনের সালাত

                    </div>
                </div>
            `;

            // --- ৫টি লিডারবোর্ড কার্ড এর কন্টেইনার ---

                <div class="mt-8 space-y-6 pb-8">

                    </div>
                </div>
            `;
            
            main.innerHTML = `
                ${datePickerHTML}
                ${calendarHTML}
                ${graphHTML}
                ${leaderboardsHTML}
            `;
            lucide.createIcons();
            
            // কার্ডগুলো লোড করার ফাংশন কল
            loadLeaderboardWidgets(); 
        }

   String.prototype.hashCode = function() {
  let hash = 0;
  for (let i = 0; i < this.length; i++) {
    const char = this.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0; 
  }
  return hash;
};

// ১. তারিখ ফরম্যাট করার ফাংশন (YYYY-MM-DD)
function getDateKey(dateObj) {
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// ২. নির্দিষ্ট দিনের পয়েন্ট বের করা
function getPointsForDate(history, dateObj) {
    if (!history) return 0;
    const key = getDateKey(dateObj);
    return history[key] || 0;
}

// ৩. রেঞ্জ অনুযায়ী পয়েন্ট যোগ করা (আজকের দিন বাদে পেছনের X দিন)
function getPointsForPastDays(history, days) {
    if (!history) return 0;
    let total = 0;
    const today = new Date();
    
    // i = 1 মানে গতকাল থেকে শুরু, i = days মানে X দিন আগে পর্যন্ত
    for (let i = 1; i <= days; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        total += getPointsForDate(history, d);
    }
    return total;
}

// ৪. লাইফটাইম পয়েন্ট (হিস্টোরি থেকে সব যোগ করা)
function getTotalHistoryPoints(history) {
    if (!history) return 0;
    let total = 0;
    Object.values(history).forEach(p => total += (parseInt(p) || 0));
    return total;
}

// ৫. ফায়ারবেস থেকে সব ইউজার এনে লজিক অনুযায়ী প্রসেস করা
// ৫. ফায়ারবেস থেকে সব ইউজার এনে লজিক অনুযায়ী প্রসেস করা (আপডেট করা)
async function getTopUsersByMetric(metricType, limit = 100) {
    try {
        const usersRef = ref(db, 'users');
        const snapshot = await get(usersRef);

        if (!snapshot.exists()) return [];

        let processedUsers = [];
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);

        snapshot.forEach((child) => {
            const data = child.val();
            const history = data.pointsHistory || {};
            const stats = data.stats || {}; 
            let score = 0;

            // লজিক অনুযায়ী পয়েন্ট সেট করা
            if (metricType === 'todayPoints') {
                score = getPointsForDate(history, today);
            } 
            else if (metricType === 'yesterdayPoints') {
                score = getPointsForDate(history, yesterday);
            } 
            else if (metricType === 'totalPoints7Days') {
                score = getPointsForPastDays(history, 7);
            } 
            else if (metricType === 'totalPoints30Days') {
                score = getPointsForPastDays(history, 30);
            } 
            else if (metricType === 'totalPoints') {
                score = getTotalHistoryPoints(history);
            }
            else if (metricType === 'highScore30Days') {
                score = stats.highScore30Days || 0;
            }

            processedUsers.push({
                name: data.name || 'বেনামী',
                points: score,
                id: child.key
            });
        });

        // বেশি পয়েন্ট থেকে কম পয়েন্টে সাজানো
        processedUsers.sort((a, b) => b.points - a.points);

        // limit 0 হলে সব ইউজার রিটার্ন করবে (র‍্যাঙ্ক বের করার জন্য), নাহলে নির্দিষ্ট সংখ্যক
        return limit === 0 ? processedUsers : processedUsers.slice(0, limit);

    } catch (error) {
        console.error("Error calculating leaderboard:", error);
        return [];
    }
}

window.fetchLeaderboard = async function(type = 'totalPoints') {
    try {
        // এখানেও আমরা নতুন ক্যালকুলেশন ফাংশন ব্যবহার করছি
        const usersArray = await getTopUsersByMetric(type, 20);
        
        if (usersArray.length === 0) {
            return '<p class="text-center text-gray-500 mt-4">লিডারবোর্ডে কোনো ডাটা নেই।</p>';
        }

        let leaderboardHTML = '';
        let rank = 1;
        const currentUserId = auth.currentUser ? auth.currentUser.uid : null;

        usersArray.forEach(u => {
            const isMe = currentUserId === u.id;
            const rowClass = isMe 
                ? 'bg-teal-100 border-teal-500 ring-1 ring-teal-500 transform scale-105 shadow-md z-10' 
                : 'bg-white border-gray-200';
            
            const rankBadgeColor = rank === 1 ? 'bg-yellow-400 text-white' : 
                                   rank === 2 ? 'bg-gray-300 text-gray-700' : 
                                   rank === 3 ? 'bg-orange-300 text-white' : 'bg-gray-100 text-gray-600';

            leaderboardHTML += `
                <div class="flex items-center justify-between p-3 mb-2 rounded-lg border ${rowClass} transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full ${rankBadgeColor} flex items-center justify-center font-bold text-sm shadow-sm">
                            ${rank === 1 ? '👑' : rank}
                        </div>
                        <div>
                            <p class="font-bold text-gray-800 text-sm flex items-center">
                                ${u.name} 
                                ${isMe ? '<span class="ml-2 text-[10px] bg-teal-600 text-white px-1.5 rounded">আমি</span>' : ''}
                            </p>
                        </div>
                    </div>
                    <div class="font-bold text-teal-700 text-sm bg-teal-50 px-2 py-1 rounded">
                        ${u.points} <span class="text-xs font-normal text-gray-500">pts</span>
                    </div>
                </div>`;
            rank++;
        });
        return leaderboardHTML;
    } catch (error) {
        console.error("Leaderboard Error:", error);
        return `<div class="text-center text-red-500 text-xs mt-4 p-4 bg-red-50 rounded">
                    ডাটা লোড করতে সমস্যা হয়েছে।<br>
                    (ইন্টারনেট চেক করুন অথবা অ্যাপ রিস্টার্ট দিন)
                </div>`;
    }
}

    // মডাল ওপেন করার নতুন ফাংশন (আগের openLeaderboard এর পরিবর্তে এটি ব্যবহার হবে)

    // একটি ইউটিলিটি ফাংশন যা বর্তমান তারিখকে YYYY-MM-DD ফরম্যাটে দেবে
function getFormattedDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// --- নতুন র‍্যাঙ্ক ক্যালকুলেশন ফাংশন ---
async function fetchAndDisplayRank(statKey, elementId) {
    const el = document.getElementById(elementId);
    
    // ইউজার লগইন না থাকলে বা এলিমেন্ট না পেলে ফাংশন থামিয়ে দিন
    if (!el || !auth.currentUser) {
        if(el) el.innerHTML = ''; 
        return;
    }

    try {
        // ১. লোডিং আইকন দেখান
        el.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin text-gray-400"></i>`;
        if (window.lucide) window.lucide.createIcons();

        // ২. নতুন লজিক: সব ইউজারকে ওই ক্যাটাগরিতে সাজাবো (limit: 0 দিয়ে)
        const sortedUsers = await getTopUsersByMetric(statKey, 0);

        // ৩. নিজের আইডি দিয়ে লিস্টে আমার অবস্থান (Index) খুঁজে বের করা
        const myUid = auth.currentUser.uid;
        const myRankIndex = sortedUsers.findIndex(u => u.id === myUid);

        if (myRankIndex !== -1) {
            const rank = myRankIndex + 1; // Index 0 থেকে শুরু হয়, তাই Rank হবে +1
            const myScore = sortedUsers[myRankIndex].points;

            // ব্যাজ তৈরি করে বসানো
            el.innerHTML = getRankBadgeHTML(rank);
            if (window.lucide) window.lucide.createIcons();
            
        } else {
            // যদি খুঁজে না পাওয়া যায়
            el.innerHTML = '<span class="text-xs font-bold text-gray-400">NA</span>';
        }

    } catch (e) {
        console.error("Rank fetch error:", e);
        el.innerHTML = ''; 
    }
}

// --- নতুন ডিজাইন: আইকন থাকবে, সাথে নাম্বারও থাকবে এবং সাইজ বড় হবে ---
function getRankBadgeHTML(rank) {
    // কমন স্টাইল (মাঝখানে থাকবে, একটু বড় ফন্ট)
    const commonClasses = "flex items-center justify-center gap-1 px-2 py-0.5 rounded-full shadow-sm border backdrop-blur-sm transition-transform hover:scale-105 cursor-default";
    
    // ১. গোল্ড (১ম স্থান) - ক্রাউন + #1
    if (rank === 1) {
        return `
            <div class="${commonClasses} bg-yellow-50 border-yellow-400" title="দেশসেরা (১ম)">
                <i data-lucide="crown" class="w-3.5 h-3.5 text-yellow-600 fill-yellow-600"></i>
                <span class="text-xs font-bold text-yellow-700">#1</span>
            </div>
        `;
    }
    // ২. সিলভার (২য় স্থান) - মেডেল + #2
    if (rank === 2) {
        return `
            <div class="${commonClasses} bg-gray-50 border-gray-400" title="২য় স্থান">
                <i data-lucide="medal" class="w-3.5 h-3.5 text-gray-500 fill-gray-300"></i>
                <span class="text-xs font-bold text-gray-600">#2</span>
            </div>
        `;
    }
    // ৩. ব্রোঞ্জ (৩য় স্থান) - মেডেল + #3
    if (rank === 3) {
        return `
            <div class="${commonClasses} bg-orange-50 border-orange-400" title="৩য় স্থান">
                <i data-lucide="medal" class="w-3.5 h-3.5 text-orange-600 fill-orange-200"></i>
                <span class="text-xs font-bold text-orange-700">#3</span>
            </div>
        `;
    }
    
    // ৪. সাধারণ র‍্যাঙ্ক (৪র্থ বা তার বেশি) - শুধু নাম্বার (বড় সাইজ)
    return `
        <div class="${commonClasses} bg-white/90 border-teal-200">
            <span class="text-xs font-bold text-teal-700">#${rank}</span>
        </div>
    `;
}

// এই ফাংশনটি আপনার স্ক্রিপ্টের যেকোনো জায়গায় থাকতে পারে

    if (window.device.platform === 'Android') {

        if (window.plugins && window.plugins.intentShim) {
            window.plugins.intentShim.startActivity(
                {
                    action: "android.settings.REQUEST_SCHEDULE_EXACT_ALARM",
                    url: "package:" + packageName
                },
                function() { console.log("Settings opened"); },
                function() { alert("সেটিংস ওপেন করা যায়নি। অনুগ্রহ করে ম্যানুয়ালি পারমিশন দিন।"); }
            );
        } else {
            alert("Intent প্লাগইনটি ইনস্টল করা নেই।");
        }
    }
}
